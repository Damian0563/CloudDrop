server {
    listen 80;
    server_name 34.118.126.125;
    return 301 https://$host$request_uri;
}

server{
	listen 443 ssl;
	server_name 34.118.126.125 34.118.126.125;
	ssl_certificate /etc/letsencrypt/live/34.118.126.125/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/34.118.126.125/privkey.pem;
	location / {
		proxy_pass http://app:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
