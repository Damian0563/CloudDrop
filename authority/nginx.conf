server {
    listen 80;
    server_name codrawapp.com www.codrawapp.com;
    return 301 https://$host$request_uri;
}

server{
	listen 443 ssl;
	server_name www.codrawapp.com codrawapp.com;
	ssl_certificate /etc/letsencrypt/live/codrawapp.com/fullchain.pem;
  	ssl_certificate_key /etc/letsencrypt/live/codrawapp.com/privkey.pem;
	location / {
		proxy_pass http://app:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
